
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faqja ime e parë</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px #0001;
        }

        h1 {
            color: #2457c5;
        }

        button {
            background: #2457c5;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Mirë se vini në faqen time!</h1>
        <p>Unë jam Elsa Dashi.</p>
        <p>Kjo është faqja ime e parë web.</p>
        <p>E krijuar me HTML, CSS dhe JavaScript.</p>

        <button onclick="pershendetje()">Kliko këtu</button>

        <p id="mesazhi"></p>
    </div>

    <script>
        function pershendetje() {
            document.getElementById("mesazhi").textContent =
                "Urime! JavaScript funksionon!";
        }
    </script>
</body>
</html>
