
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website-i im i parë online!</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            text-align: center;
            padding: 50px 20px;
        }

       .card {
    max-width: 600px;
    margin: auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

        h1 {
    color: #6d28d9;
  }  

h2 {
    color: #2563eb;
}

section {
    background-color: #f3f4f6;
    padding: 15px;
    border-radius: 12px;
    margin: 25px 0;
}


      button {
    background: #6d28d9;
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover {
    background: #4c1d95;
}      
    </style>
</head>

<body>
    <div class="card">
        <h1>Website-i im i parë online!</h1>
        <p>Unë jam Elsa Dashi.</p>
        <p>Kjo është faqja ime e parë web.</p>
        <p>E krijuar me HTML, CSS dhe JavaScript.</p>
        
        <section>
            <h2>Rreth meje</h2>
            <p>Unë jam Elsa Dashi.</p>
            <p>Jam e interesuar për teknologjinë arsimore dhe zhvillimin e faqeve web.</p>
        </section>
        <button onclick="pershendetje()">Kliko këtu</button>

        <p id="mesazhi"></p>
    </div>

    <script>
        function pershendetje() {
            document.getElementById("mesazhi").textContent =
                "Urime! JavaScript funksionon!";
        }
    </script>
</body>
</html>
